[env:votol-bt-bridge]
platform = espressif32@7.1.3   # pinned (review: reproducible builds)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BT Classic + WiFi + OTA needs more than the default 1.3MB app slot
board_build.partitions = min_spiffs.csv
; WiFi config portal + OTA only; the Bluetooth bridge itself needs none of this
lib_deps =
	tzapu/WiFiManager@2.0.17   # pinned

; Over-the-air updates over WiFi (ArduinoOTA = UDP 3232, via espota):
;   pio run -e votol-bt-bridge-ota -t upload --upload-port votol-bt-bridge.local
[env:votol-bt-bridge-ota]
extends = env:votol-bt-bridge
upload_protocol = espota
upload_flags = --port=3232

; ONE-CHIP variant: BT bridge + keyless/alarm on the same ESP32.
; BLE scan runs alongside Bluetooth Classic SPP (dual-mode controller).
; Keyless endpoints live under /k/* so they can't collide with bridge ones
; (/test stays "send test bytes"). Endpoints: /k/arm /k/disarm /k/panic
; /k/test /k/fob /k/scan /k/cfg /state.json. See keyless-alarm/WIRING.md
; for relay/buzzer/vibe wiring — power still must be battery-side, always-on.
[env:votol-bt-bridge-keyless]
extends = env:votol-bt-bridge
build_flags = -DWITH_KEYLESS

[env:votol-bt-bridge-keyless-ota]
extends = env:votol-bt-bridge-keyless
upload_protocol = espota
upload_flags = --port=3232

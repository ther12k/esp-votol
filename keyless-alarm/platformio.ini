[env:votol-keyless]
platform = espressif32@7.1.3   # pinned (review: reproducible builds)
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; BLE + WiFi + WebServer + OTA needs more than the default 1.3MB app slot
; (same lesson as votol-bt-bridge)
board_build.partitions = min_spiffs.csv
lib_deps =
	tzapu/WiFiManager@2.0.17   # pinned

; Over-the-air updates over WiFi (ArduinoOTA = UDP 3232, via espota):
;   pio run -e votol-keyless-ota -t upload --upload-port votol-keyless.local
[env:votol-keyless-ota]
extends = env:votol-keyless
upload_protocol = espota
upload_flags = --port=3232

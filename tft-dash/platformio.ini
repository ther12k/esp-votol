[env:votol-dash]
platform = espressif32@7.1.3   # pinned (same as the other modules, reproducible builds)
board = esp32dev               # WEMOS D1 R32 = ESP32-WROOM in UNO form factor
framework = arduino
monitor_speed = 115200
upload_speed = 460800   ; 921600 flaked on this clone (boot-probe assert + NVS wipe, twice)
; huge_app: 3 MB app slot — needed because BT Classic SPP + BLE scan +
; display all live together (min_spiffs's 1.9 MB app was 82% and BLE
; overflows it; we don't use SPIFFS anyway)
board_build.partitions = huge_app.csv
build_src_filter = +<main.cpp> +<vendor/*.c> -<diag.cpp> -<touchprobe.cpp>
lib_deps =
	https://github.com/prenticedavid/MCUFRIEND_kbv.git#v3.0.0   # UNO 8-bit-parallel shields, official D1-R32 pin map
	adafruit/Adafruit GFX Library@1.11.9

; Over-the-air updates over WiFi (ArduinoOTA = UDP 3232, via espota):
;   pio run -e votol-dash-ota -t upload --upload-port votol-dash.local
[env:votol-dash-ota]
extends = env:votol-dash
upload_protocol = espota
upload_flags = --port=3232

; First-flash hardware check: prints the LCD controller ID over USB serial,
; paints test bars, and streams raw touch readings. No WiFi, no polling.
[env:votol-dash-diag]
extends = env:votol-dash
build_src_filter = +<diag.cpp> -<main.cpp> -<touchprobe.cpp>
lib_deps =
	https://github.com/prenticedavid/MCUFRIEND_kbv.git#v3.0.0
	adafruit/Adafruit GFX Library@1.11.9
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; One-shot: discovers whether the touch chip is wired through the UNO
; sockets (T_* on D10-D13) or needs the 4 extra wires.
[env:votol-dash-touchprobe]
extends = env:votol-dash
build_src_filter = +<touchprobe.cpp> -<main.cpp> -<diag.cpp>
